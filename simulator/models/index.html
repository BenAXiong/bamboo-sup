<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070708" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ciowayan" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Ciowayan 工作坊 · 3D 模型</title>
    <style>
      /* Phone first, for elderly visitors: big type, big targets, few choices, nothing hidden.
         Dark and quiet so the models carry the colour; high contrast everywhere (text >= 7:1). */
      :root {
        --bg: #070708; --bg-2: #111214; --ink: #f4f1ec; --muted: #b3ada4; --line: rgba(255, 255, 255, 0.12); --line-2: rgba(255, 255, 255, 0.22);
        --card: #141416; --card-2: #1b1c1f; --accent: #f0b35a; --accent-ink: #1a1206; --amis: #f3c27a;
        --glass: rgba(10, 10, 12, 0.62); --glass-btn: rgba(26, 27, 30, 0.72);
        --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        --pad: max(16px, env(safe-area-inset-left, 0px));
        color-scheme: dark;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; margin: 0; }
      body { background: radial-gradient(120% 70% at 50% 0%, #1d1e22 0%, var(--bg) 60%) fixed, var(--bg); color: var(--ink);
        font: 20px/1.5 var(--font); overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
      button { font-family: var(--font); color: inherit; cursor: pointer; transition: background-color 0.15s, border-color 0.15s, transform 0.1s; }
      button:active { transform: scale(0.97); }
      button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      [hidden] { display: none !important; }

      /* ---------------------------------------------------------------- header */
      header { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
        padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--pad) 10px; pointer-events: none; }
      header > * { pointer-events: auto; }
      header h1 { flex: 1; margin: 0; font-size: 24px; font-weight: 800; line-height: 1.2; letter-spacing: 0.01em; min-width: 0;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; text-shadow: 0 1px 12px rgba(0,0,0,0.6); }
      /* The home title may take two lines (it breaks only at its middle dot), plus the version line on tap. */
      #version { display: block; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0.04em; margin-top: 2px; }
      header h1.wrap { pointer-events: auto; cursor: default; white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; }
      .round { height: 52px; min-width: 52px; padding: 0 16px; border-radius: 26px; border: 1px solid var(--line-2); background: var(--glass-btn);
        -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
        font-size: 18px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 18px rgba(0,0,0,0.35); }
      .round:hover { border-color: rgba(255,255,255,0.4); }
      #back { font-size: 28px; padding: 0 14px 4px; }
      #bg { height: 40px; min-width: 0; padding: 0 12px 0 10px; font-size: 15px; font-weight: 600; color: var(--muted); }
      #bg svg { width: 22px; height: 22px; }
      #bg .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.25); }
      #bg[aria-pressed="true"] .dot { background: #5fd39a; box-shadow: 0 0 8px #5fd39a; }

      /* ---------------------------------------------------------------- pages */
      main { padding: calc(env(safe-area-inset-top, 0px) + 96px) var(--pad) calc(env(safe-area-inset-bottom, 0px) + 28px); max-width: 720px; margin: 0 auto; }
      .lead { margin: 0 0 20px; color: var(--muted); font-size: 20px; }
      .cards { display: grid; gap: 16px; }
      @media (min-width: 700px) { .cards.two { grid-template-columns: 1fr 1fr; } }
      .card { display: block; width: 100%; text-align: left; padding: 0; border: 1px solid var(--line); border-radius: 22px; overflow: hidden;
        background: linear-gradient(var(--card-2), var(--card)); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); text-decoration: none; color: inherit;
        transition: transform 0.15s, border-color 0.15s; }
      .card:hover { border-color: var(--line-2); }
      .card:active { transform: scale(0.985); }
      .card .pic { aspect-ratio: 16 / 10; background: #1a1b1e center / cover no-repeat; position: relative; }
      .card .pic::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(20,20,22,0) 55%, rgba(20,20,22,0.85)); }
      .card .txt { padding: 4px 20px 20px; margin-top: -26px; position: relative; }
      .card .name { font-size: 30px; font-weight: 800; line-height: 1.2; letter-spacing: 0.01em; }
      .card .other { font-size: 18px; color: var(--muted); }
      .card .amis { font-size: 18px; color: var(--amis); font-weight: 700; letter-spacing: 0.02em; }
      .card .sub { font-size: 19px; margin-top: 6px; color: #d9d4cc; }
      .card.wip .pic { filter: grayscale(0.7) brightness(0.7); }
      .card .badge { position: absolute; top: 14px; left: 14px; z-index: 1; padding: 4px 12px; border-radius: 999px; font-size: 16px; font-weight: 700;
        background: rgba(10,10,12,0.75); border: 1px solid var(--line-2); color: var(--ink); }

      /* ---------------------------------------------------------------- model page */
      canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; gap: 10px;
        padding: 14px var(--pad) calc(env(safe-area-inset-bottom, 0px) + 14px);
        background: linear-gradient(rgba(7,7,8,0), rgba(7,7,8,0.7) 40%); }
      .big { flex: 1; min-width: 0; height: 68px; border-radius: 20px; border: 1px solid var(--line-2); background: var(--glass-btn);
        -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
        font-size: 21px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); }
      .big .ic { font-size: 22px; line-height: 1; margin-bottom: 3px; opacity: 0.9; }
      .big.main { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 6px 24px rgba(240, 179, 90, 0.28); }
      .big[aria-pressed="true"] { background: var(--ink); color: #0b0b0c; border-color: transparent; }
      #tip { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 104px); transform: translateX(-50%); z-index: 9;
        background: rgba(20, 20, 22, 0.82); border: 1px solid var(--line); color: var(--ink); padding: 10px 18px; border-radius: 14px; font-size: 18px; text-align: center;
        -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        width: max-content; max-width: calc(100vw - 32px); pointer-events: none; transition: opacity 0.6s; }
      #loading { position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; font-size: 22px; color: var(--muted); background: rgba(7,7,8,0.7); }

      /* ---------------------------------------------------------------- part card on glass */
      #focus { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; overflow-y: auto;
        background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.2); backdrop-filter: blur(22px) saturate(1.2);
        padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--pad) calc(env(safe-area-inset-bottom, 0px) + 24px);
        animation: fade 0.22s ease; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      #focus .top { align-self: stretch; display: flex; justify-content: flex-end; }
      #close { width: 60px; height: 60px; border-radius: 30px; font-size: 28px; padding: 0; }
      #part { width: min(92vw, 46vh, 520px); aspect-ratio: 1; display: block; margin-top: -8px; }
      #info { width: min(100%, 560px); background: rgba(22, 23, 26, 0.86); border: 1px solid var(--line); border-radius: 22px; padding: 18px 20px 20px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); }
      #info h2 { margin: 0; font-size: 32px; line-height: 1.2; }
      #info .other { font-size: 19px; color: var(--muted); }
      #info .amis { font-size: 21px; color: var(--amis); font-weight: 700; margin-top: 2px; letter-spacing: 0.02em; }
      #info dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 14px 0 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 21px; }
      #info dt { color: var(--muted); }
      #info dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
      #info p { margin: 12px 0 0; font-size: 20px; color: #ddd8d0; }

      /* ---------------------------------------------------------------- small note (work in progress) */
      #note { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px var(--pad);
        background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); animation: fade 0.2s ease; }
      #note .box { width: min(100%, 460px); background: rgba(22, 23, 26, 0.92); border: 1px solid var(--line-2); border-radius: 22px; padding: 22px 22px 18px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); }
      #note p { margin: 0 0 18px; font-size: 22px; }
      #note-ok { width: 100%; height: 60px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 21px; font-weight: 800; }
    </style>
  </head>
  <body>
    <header>
      <button id="back" class="round" hidden aria-label="返回">‹</button>
      <h1 id="title"></h1>
      <button id="bg" class="round" hidden aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="16.5" cy="7.5" r="2.5" /><path d="M2 15c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0" /><path d="M2 19.5c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0" />
        </svg>
        <span id="bg-label"></span><span class="dot"></span>
      </button>
      <button id="lang" class="round"></button>
    </header>

    <main id="page"></main>

    <canvas id="scene" hidden></canvas>
    <div id="loading" hidden></div>
    <div id="tip" hidden></div>
    <nav id="bar" hidden>
      <button id="explode" class="big main"><span class="ic">⇕</span><span id="explode-label"></span></button>
      <button id="spin" class="big" aria-pressed="true"><span class="ic">↻</span><span id="spin-label"></span></button>
      <button id="reset" class="big"><span class="ic">⌂</span><span id="reset-label"></span></button>
    </nav>

    <div id="focus" hidden role="dialog" aria-modal="true">
      <div class="top"><button id="close" class="round" aria-label="關閉">✕</button></div>
      <canvas id="part"></canvas>
      <div id="info"></div>
    </div>

    <div id="note" hidden role="alertdialog" aria-modal="true">
      <div class="box"><p id="note-text"></p><button id="note-ok"></button></div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
