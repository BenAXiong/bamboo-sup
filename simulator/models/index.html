<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efe9df" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>竹子與茅草的模型</title>
    <style>
      /* Phone first, for elderly visitors: big type, big targets, few choices, nothing hidden. */
      :root {
        --bg: #efe9df; --bg-2: #e2d9cb; --ink: #241c14; --muted: #6b5f51; --line: rgba(60, 40, 20, 0.16);
        --card: #fffdf8; --rattan: #9c6a26; --rattan-ink: #ffffff; --chip: #f4eee4;
        --glass: rgba(250, 247, 241, 0.5);
        --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        --pad: max(16px, env(safe-area-inset-left, 0px));
        color-scheme: light;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; margin: 0; }
      body { background: linear-gradient(var(--bg), var(--bg-2)) fixed; color: var(--ink); font: 20px/1.5 var(--font); overscroll-behavior: none; }
      button { font-family: var(--font); color: inherit; cursor: pointer; }
      button:active { transform: scale(0.97); }
      [hidden] { display: none !important; }

      /* ---------------------------------------------------------------- header */
      header { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
        padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--pad) 10px; pointer-events: none; }
      header > * { pointer-events: auto; }
      header h1 { flex: 1; margin: 0; font-size: 24px; line-height: 1.2; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        pointer-events: none; text-shadow: 0 1px 0 rgba(255,255,255,0.7); }
      .round { height: 52px; min-width: 52px; padding: 0 16px; border-radius: 26px; border: 1px solid var(--line); background: rgba(255,253,248,0.92);
        font-size: 18px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 2px 8px rgba(40,25,10,0.08); }
      #back { font-size: 26px; padding: 0 14px 4px; }
      #bg { height: 40px; min-width: 0; padding: 0 12px 0 10px; font-size: 15px; font-weight: 600; color: var(--muted); }
      #bg svg { width: 22px; height: 22px; }
      #bg .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
      #bg[aria-pressed="true"] .dot { background: #3f8f6a; }

      /* ---------------------------------------------------------------- pages */
      main { padding: calc(env(safe-area-inset-top, 0px) + 84px) var(--pad) calc(env(safe-area-inset-bottom, 0px) + 28px); max-width: 720px; margin: 0 auto; }
      .lead { margin: 0 0 18px; color: var(--muted); font-size: 20px; }
      .cards { display: grid; gap: 16px; }
      @media (min-width: 700px) { .cards.two { grid-template-columns: 1fr 1fr; } }
      .card { display: block; width: 100%; text-align: left; padding: 0; border: 1px solid var(--line); border-radius: 22px; overflow: hidden;
        background: var(--card); box-shadow: 0 4px 16px rgba(40, 25, 10, 0.08); text-decoration: none; color: inherit; }
      .card:active { transform: scale(0.985); }
      .card .pic { aspect-ratio: 16 / 10; background: #ddd3c4 center / cover no-repeat; }
      .card .txt { padding: 14px 18px 18px; }
      .card .name { font-size: 30px; font-weight: 800; line-height: 1.2; }
      .card .other { font-size: 18px; color: var(--muted); }
      .card .amis { font-size: 18px; color: var(--rattan); font-weight: 700; }
      .card .sub { font-size: 19px; margin-top: 4px; }

      /* ---------------------------------------------------------------- model page */
      canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; gap: 10px;
        padding: 12px var(--pad) calc(env(safe-area-inset-bottom, 0px) + 14px);
        background: linear-gradient(rgba(239,233,223,0), rgba(239,233,223,0.85) 35%); }
      .big { flex: 1; min-width: 0; height: 68px; border-radius: 20px; border: 1px solid var(--line); background: var(--card);
        font-size: 21px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15;
        box-shadow: 0 3px 12px rgba(40, 25, 10, 0.12); }
      .big .ic { font-size: 22px; line-height: 1; margin-bottom: 3px; }
      .big.main { background: var(--rattan); color: var(--rattan-ink); border-color: transparent; }
      .big[aria-pressed="true"] { background: var(--ink); color: #fff; }
      #tip { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); transform: translateX(-50%); z-index: 9;
        background: rgba(36, 28, 20, 0.78); color: #fff; padding: 10px 18px; border-radius: 14px; font-size: 18px; text-align: center;
        width: max-content; max-width: calc(100vw - 32px); pointer-events: none; transition: opacity 0.6s; }
      #loading { position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; font-size: 22px; color: var(--muted); background: rgba(239,233,223,0.6); }

      /* ---------------------------------------------------------------- part card on glass */
      #focus { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; overflow-y: auto;
        background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.15); backdrop-filter: blur(18px) saturate(1.15);
        padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--pad) calc(env(safe-area-inset-bottom, 0px) + 24px);
        animation: fade 0.22s ease; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      #focus .top { align-self: stretch; display: flex; justify-content: flex-end; }
      #close { width: 60px; height: 60px; border-radius: 30px; font-size: 30px; padding: 0; }
      #part { width: min(92vw, 46vh, 520px); aspect-ratio: 1; display: block; margin-top: -8px; }
      #info { width: min(100%, 560px); background: rgba(255,253,248,0.82); border: 1px solid var(--line); border-radius: 22px; padding: 18px 20px 20px;
        box-shadow: 0 6px 24px rgba(40, 25, 10, 0.12); }
      #info h2 { margin: 0; font-size: 32px; line-height: 1.2; }
      #info .other { font-size: 19px; color: var(--muted); }
      #info .amis { font-size: 21px; color: var(--rattan); font-weight: 700; margin-top: 2px; }
      #info dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 14px 0 0; font-size: 21px; }
      #info dt { color: var(--muted); }
      #info dd { margin: 0; font-weight: 700; }
      #info p { margin: 12px 0 0; font-size: 20px; }
    </style>
  </head>
  <body>
    <header>
      <button id="back" class="round" hidden aria-label="返回">‹</button>
      <h1 id="title"></h1>
      <button id="bg" class="round" hidden aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="16.5" cy="7.5" r="2.5" /><path d="M2 15c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0" /><path d="M2 19.5c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0" />
        </svg>
        <span id="bg-label"></span><span class="dot"></span>
      </button>
      <button id="lang" class="round"></button>
    </header>

    <main id="page"></main>

    <canvas id="scene" hidden></canvas>
    <div id="loading" hidden></div>
    <div id="tip" hidden></div>
    <nav id="bar" hidden>
      <button id="explode" class="big main"><span class="ic">⇕</span><span id="explode-label"></span></button>
      <button id="spin" class="big" aria-pressed="true"><span class="ic">↻</span><span id="spin-label"></span></button>
      <button id="reset" class="big"><span class="ic">⌂</span><span id="reset-label"></span></button>
    </nav>

    <div id="focus" hidden role="dialog" aria-modal="true">
      <div class="top"><button id="close" class="round" aria-label="關閉">✕</button></div>
      <canvas id="part"></canvas>
      <div id="info"></div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
