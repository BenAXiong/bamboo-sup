<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bamboo SUP designer</title>
    <style>
      :root {
        --bg-top: #eceae6; --bg-bottom: #c8c4bc; --ink: #1d1f22; --muted: #646870;
        --card: rgba(255, 255, 255, 0.9); --card-solid: #f7f5f1; --line: rgba(0, 0, 0, 0.1);
        --accent: #a8601e; --accent-soft: rgba(168, 96, 30, 0.14); --track: #d9d4cb;
        --good: #2f7d4a; --warn: #b07a12; --bad: #b3362b;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg-top: #2a2c30; --bg-bottom: #121315; --ink: #eceae6; --muted: #a0a4ab;
          --card: rgba(26, 28, 31, 0.92); --card-solid: #1c1e21; --line: rgba(255, 255, 255, 0.12);
          --accent: #e09a52; --accent-soft: rgba(224, 154, 82, 0.16); --track: #3a3d42;
          --good: #6cc48a; --warn: #e3b14a; --bad: #ef7a6e;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg-top: #2a2c30; --bg-bottom: #121315; --ink: #eceae6; --muted: #a0a4ab;
        --card: rgba(26, 28, 31, 0.92); --card-solid: #1c1e21; --line: rgba(255, 255, 255, 0.12);
        --accent: #e09a52; --accent-soft: rgba(224, 154, 82, 0.16); --track: #3a3d42;
        --good: #6cc48a; --warn: #e3b14a; --bad: #ef7a6e;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; color: var(--ink);
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg-bottom); }
      body { background: linear-gradient(var(--bg-top), var(--bg-bottom)); }
      #stage { position: fixed; inset: 0 360px 0 0; }
      canvas#scene { display: block; width: 100%; height: 100%; touch-action: none; }
      button { font: inherit; color: inherit; cursor: pointer; }

      /* ------------------------------------------------ view bar */
      #viewbar { position: absolute; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
      #viewbar > * { pointer-events: auto; }
      .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 2px; backdrop-filter: blur(6px); }
      .seg button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; white-space: nowrap; }
      .seg button:hover { background: var(--accent-soft); }
      .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
      #busy { position: absolute; right: 12px; bottom: 12px; background: var(--card); border: 1px solid var(--line);
        border-radius: 8px; padding: 4px 10px; color: var(--muted); opacity: 0; transition: opacity .2s; }
      #busy.on { opacity: 1; }

      /* ------------------------------------------------ panel */
      #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 360px; display: flex; flex-direction: column;
        background: var(--card-solid); border-left: 1px solid var(--line); }
      #panel header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
      #panel h1 { font-size: 16px; margin: 0; }
      #panel .sub { color: var(--muted); font-size: 12px; }
      #scroll { flex: 1; overflow-y: auto; padding: 4px 0 12px; }
      .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 11px; }
      .chip:hover { border-color: var(--accent); }
      .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

      .readout { margin: 10px 16px 6px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .stat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
      .stat .k { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .stat .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .stat.good .v { color: var(--good); } .stat.warn .v { color: var(--warn); } .stat.bad .v { color: var(--bad); }
      .note { margin: 0 16px 6px; color: var(--muted); font-size: 11px; }

      details.group { border-top: 1px solid var(--line); }
      details.group summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 10px 16px; cursor: pointer; font-weight: 600; user-select: none; }
      details.group summary::-webkit-details-marker { display: none; }
      details.group summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
      details.group[open] summary::before { transform: rotate(90deg); }
      details.group summary .reset { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--muted); border: 0; background: none; padding: 2px 6px; border-radius: 6px; }
      details.group summary .reset:hover { color: var(--accent); background: var(--accent-soft); }
      .rows { padding: 0 16px 10px; display: grid; gap: 9px; }
      .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
      .row label { font-size: 12.5px; }
      .row .help { grid-column: 1 / -1; color: var(--muted); font-size: 11px; margin-top: -1px; }
      .row.changed label::after { content: " •"; color: var(--accent); }
      .val { display: inline-flex; align-items: baseline; gap: 3px; }
      .val input { width: 62px; text-align: right; font: inherit; font-variant-numeric: tabular-nums; color: inherit;
        background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 1px 4px; }
      .val input:hover { border-color: var(--line); }
      .val input:focus { border-color: var(--accent); outline: none; background: var(--card); }
      .val .u { color: var(--muted); font-size: 11px; min-width: 18px; }
      input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); height: 18px; }
      .choice { grid-column: 1 / -1; display: flex; }
      .choice .seg { width: 100%; background: none; }
      .choice .seg button { flex: 1; }
      .toggle { position: relative; width: 34px; height: 20px; border-radius: 999px; border: 0; background: var(--track); padding: 0; }
      .toggle::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
      .toggle[aria-checked="true"] { background: var(--accent); }
      .toggle[aria-checked="true"]::after { left: 16px; }
      .seedrow { display: flex; gap: 6px; align-items: center; }

      #panel footer { border-top: 1px solid var(--line); padding: 10px 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 8px; }
      .btn:hover:not(:disabled) { border-color: var(--accent); }
      .btn:disabled { opacity: .4; cursor: default; }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--card-solid);
        padding: 7px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 5; }
      #toast.on { opacity: 1; }

      @media (max-width: 760px) {
        #stage { inset: 0 0 52vh 0; }
        #panel { top: auto; height: 52vh; width: 100%; border-left: 0; border-top: 1px solid var(--line); }
      }
      body.still #panel, body.still #viewbar, body.still #busy { display: none; }
      body.still #stage { inset: 0; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="scene"></canvas>
      <div id="viewbar">
        <div class="seg" id="cams"></div>
        <div class="seg" id="shows"></div>
      </div>
      <div id="busy">Rebuilding…</div>
    </div>
    <aside id="panel">
      <header>
        <h1>Bamboo SUP</h1>
        <div class="sub">Drag sliders or type a value. Every change rebuilds the board.</div>
        <div class="presets" id="presets"></div>
      </header>
      <div id="scroll">
        <div class="readout" id="readout"></div>
        <div class="note" id="readnote"></div>
        <div id="groups"></div>
      </div>
      <footer>
        <button class="btn" id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
        <button class="btn" id="redo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
        <button class="btn" id="resetAll">Reset all</button>
        <button class="btn" id="copyLink" title="Copy a link that opens this exact board">Copy link</button>
        <button class="btn" id="import">Import…</button>
        <button class="btn primary" id="export">Export JSON</button>
      </footer>
    </aside>
    <input type="file" id="file" accept=".json,application/json" hidden />
    <div id="toast"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
