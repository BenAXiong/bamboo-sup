<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amis bamboo raft</title>
    <style>
      html, body { height: 100%; margin: 0; background: #9fb6c8; overflow: hidden; }
      canvas#scene { display: block; width: 100vw; height: 100vh; }
      .lil-gui.root { --width: 290px; }
      .note {
        position: fixed; left: 12px; bottom: 10px; max-width: min(520px, calc(100vw - 24px));
        font: 12px/1.4 system-ui, sans-serif; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6);
        opacity: .85; pointer-events: none;
      }
      body.still .note { display: none; }
      .toast {
        position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
        background: rgba(20, 28, 34, .85); color: #fff; padding: 8px 14px; border-radius: 6px;
        font: 13px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="note">Palafang-style Amis bamboo sailing raft. Proportions estimated from photographs, not measured. Drag to orbit, scroll to zoom.</div>
    <script>
      if (new URLSearchParams(location.search).has("still")) document.body.classList.add("still");
    </script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
