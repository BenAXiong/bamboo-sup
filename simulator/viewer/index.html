<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bamboo SUP viewer</title>
    <style>
      :root {
        --bg: #eef1f4;
        --panel: #ffffff;
        --ink: #1b1d20;
        --muted: #6b7178;
        --line: #d8dee4;
        --warn: #b23c2b;
        --ok: #2f7a52;
        --font: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161a;
          --panel: #1c1f24;
          --ink: #eceef0;
          --muted: #9aa1a9;
          --line: #2b3038;
          --warn: #e8785f;
          --ok: #6fc494;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        font-size: 13px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
      }
      @media (max-width: 900px) {
        body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
      }
      #stage { position: relative; min-width: 0; min-height: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      aside {
        background: var(--panel);
        border-left: 1px solid var(--line);
        overflow-y: auto;
        padding: 18px 18px 40px;
      }
      h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: 0.02em; }
      .sub { color: var(--muted); margin: 0 0 18px; font-size: 11px; }
      fieldset { border: 0; border-top: 1px solid var(--line); margin: 0 0 4px; padding: 14px 0 6px; }
      legend { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 8px 0 0; }
      label { display: grid; grid-template-columns: 1fr auto; gap: 4px; margin-bottom: 9px; align-items: baseline; }
      label span:last-of-type { color: var(--muted); font-variant-numeric: tabular-nums; }
      input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: #77aacc; }
      .checks { display: flex; gap: 14px; margin: 4px 0 10px; }
      .checks label { display: flex; gap: 5px; grid-template-columns: none; margin: 0; }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      td { padding: 2px 0; }
      td:last-child { text-align: right; }
      td.k { color: var(--muted); }
      .flag { margin-top: 10px; padding: 8px 10px; border-radius: 4px; line-height: 1.45; }
      .flag.bad { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
      .flag.good { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
      .legend { display: flex; gap: 12px; margin-top: 8px; color: var(--muted); font-size: 11px; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="scene"></canvas></div>
    <aside>
      <h1>Bamboo SUP</h1>
      <p class="sub">Drag to orbit. Every figure is solved live by the same code the tests run.</p>

      <fieldset>
        <legend>Bundle</legend>
        <label><span>culms</span><span id="v-count"></span>
          <input type="range" id="count" min="3" max="12" step="1" /></label>
        <label><span>length</span><span id="v-length"></span>
          <input type="range" id="length" min="2000" max="5000" step="50" /></label>
        <label><span>butt diameter</span><span id="v-dbase"></span>
          <input type="range" id="dbase" min="60" max="220" step="5" /></label>
        <label><span>tip diameter</span><span id="v-dtip"></span>
          <input type="range" id="dtip" min="40" max="220" step="5" /></label>
        <label><span>gap</span><span id="v-gap"></span>
          <input type="range" id="gap" min="0" max="120" step="1" /></label>
        <label><span>bow convergence</span><span id="v-conv"></span>
          <input type="range" id="conv" min="0.5" max="1" step="0.01" /></label>
        <label><span>mass per culm</span><span id="v-mass"></span>
          <input type="range" id="mass" min="1" max="12" step="0.1" /></label>
        <div class="checks">
          <label><input type="checkbox" id="alternate" /> alternate butts</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Bow recurve</legend>
        <label><span>tip rise</span><span id="v-rise"></span>
          <input type="range" id="rise" min="0" max="900" step="10" /></label>
        <label><span>bend length</span><span id="v-bend"></span>
          <input type="range" id="bend" min="200" max="2000" step="25" /></label>
      </fieldset>

      <fieldset>
        <legend>Rider</legend>
        <label><span>mass</span><span id="v-rmass"></span>
          <input type="range" id="rmass" min="0" max="140" step="1" /></label>
        <label><span>fore / aft</span><span id="v-rx"></span>
          <input type="range" id="rx" min="0" max="5000" step="25" /></label>
        <label><span>off centre</span><span id="v-ry"></span>
          <input type="range" id="ry" min="-500" max="500" step="5" /></label>
        <label><span>CG height</span><span id="v-rz"></span>
          <input type="range" id="rz" min="0" max="1400" step="10" /></label>
      </fieldset>

      <fieldset>
        <legend>Solve</legend>
        <div class="checks">
          <label><input type="checkbox" id="dof-heel" checked /> heel</label>
          <label><input type="checkbox" id="dof-trim" checked /> trim</label>
        </div>
        <label><span>water density</span><span id="v-rho"></span>
          <input type="range" id="rho" min="980" max="1030" step="0.2" /></label>
      </fieldset>

      <fieldset>
        <legend>Result</legend>
        <table id="readout"></table>
        <div id="flag" class="flag"></div>
        <div class="legend">
          <span><span class="dot" style="background:#d6604d"></span>rider</span>
          <span><span class="dot" style="background:#2f6f9f"></span>gravity</span>
          <span><span class="dot" style="background:#4fa06f"></span>buoyancy</span>
        </div>
      </fieldset>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
