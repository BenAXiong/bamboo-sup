# Publishes the house phone viewer (site root), the public models site (/models/) and the experiment
# viewers (/sim/hut/, /sim/raft/, /sim/sup/; old /desktop/, /raft/, /sup/ redirect) to GitHub Pages on every push to master.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [master]
    paths: ["simulator/**", "designs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simulator/package-lock.json
      - run: npm ci
      - run: npm run build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: simulator/out/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
